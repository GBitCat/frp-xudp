name: Build Release Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不上传（true/false）'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Release 标题/标签版本号，不影响包名'
        required: false
        default: '0.71.0-1'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install zip
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi

      - name: Build release packages
        run: |
          GOFLAGS=-buildvcs=false ./package.sh

      - name: Generate checksums
        run: |
          cd release/packages
          sha256sum frp_*.tar.gz frp_*.zip > frp_sha256_checksums.txt
          wc -l frp_sha256_checksums.txt

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          VERSION="$INPUT_RELEASE_VERSION"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(./bin/frps --version)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release version input" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          echo "package version: $VERSION"
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Create GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "# frp-xudp v${VERSION}"
            echo ""
            cat dev/RELEASE_NOTES.md
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" release/packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "frp-xudp ${VERSION} — XUDP P2P UDP Proxy" \
            --notes-file /tmp/release-notes.md
