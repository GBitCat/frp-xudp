name: Build and Publish Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (默认使用 git describe)'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Comma-separated platforms'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build frpc/frps images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Validate build inputs
        run: |
          set -euo pipefail

          TAG_NAME="${INPUT_TAG:-$(git describe --tags --always)}"
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid image tag input" >&2
            exit 1
          fi

          case "$INPUT_PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64|linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le) ;;
            *)
              echo "unsupported platform input" >&2
              exit 1
              ;;
          esac

          {
            printf 'TAG_NAME=%s\n' "$TAG_NAME"
            printf 'PLATFORMS=%s\n' "$INPUT_PLATFORMS"
          } >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_USERNAME" || -n "$DOCKERHUB_PASSWORD" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_PASSWORD" ]]; then
              echo "Docker Hub credentials must be configured as a pair" >&2
              exit 1
            fi
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Prepare image tags
        run: |
          set -euo pipefail
          GHCR_REPO=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAGS_FRPC="ghcr.io/${GHCR_REPO}/frpc:${TAG_NAME}"
          TAGS_FRPS="ghcr.io/${GHCR_REPO}/frps:${TAG_NAME}"
          if [[ "$DOCKERHUB_ENABLED" == true ]]; then
            TAGS_FRPC="$TAGS_FRPC,${DOCKERHUB_OWNER}/frpc:${TAG_NAME}"
            TAGS_FRPS="$TAGS_FRPS,${DOCKERHUB_OWNER}/frps:${TAG_NAME}"
          fi
          {
            printf 'TAGS_FRPC=%s\n' "$TAGS_FRPC"
            printf 'TAGS_FRPS=%s\n' "$TAGS_FRPS"
          } >> "$GITHUB_ENV"
        env:
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}

      # ghcr.io 登录使用 GITHUB_TOKEN，无需配置 secrets
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 仅在配置了 secrets 时才登录/推送
      - name: Login to DockerHub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push frpc
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frpc
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.TAGS_FRPC }}

      - name: Build and push frps
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frps
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.TAGS_FRPS }}
