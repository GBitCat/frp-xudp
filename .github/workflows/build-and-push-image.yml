name: Build and Publish Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (默认使用 git describe)'
        required: false
        default: ''
      platforms:
        description: 'Comma-separated platforms'
        required: false
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build frpc/frps images
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 计算镜像 tag：优先用输入，否则 git describe
      - name: Get Image Tag Name
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "TAG_NAME=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$(git describe --tags --always)" >> "$GITHUB_ENV"
          fi

      # ghcr.io 登录使用 GITHUB_TOKEN，无需配置 secrets
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 仅在配置了 secrets 时才登录/推送
      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Prepare Image Tags
        run: |
          echo "PLATFORMS=${{ github.event.inputs.platforms }}" >> "$GITHUB_ENV"
          TAGS_FRPC="ghcr.io/${{ github.repository }}/frpc:${{ env.TAG_NAME }}"
          TAGS_FRPS="ghcr.io/${{ github.repository }}/frps:${{ env.TAG_NAME }}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            TAGS_FRPC="$TAGS_FRPC,${{ github.repository_owner }}/frpc:${{ env.TAG_NAME }}"
            TAGS_FRPS="$TAGS_FRPS,${{ github.repository_owner }}/frps:${{ env.TAG_NAME }}"
          fi
          echo "TAGS_FRPC=$TAGS_FRPC" >> "$GITHUB_ENV"
          echo "TAGS_FRPS=$TAGS_FRPS" >> "$GITHUB_ENV"

      - name: Build and push frpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frpc
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.TAGS_FRPC }}

      - name: Build and push frps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frps
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.TAGS_FRPS }}
